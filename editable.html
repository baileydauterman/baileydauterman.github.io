<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
        integrity="sha512-vswe+cgvic/XBoF1OcM/TeJ2FW0OofqAVdCZiEYkd6dwGXthvkSFWOoGGJgS2CW70VK5dQM5Oh+7ne47s74VTg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"
        integrity="sha512-7Z9J3l1+EYfeaPKcGXu3MS/7T+w19WtKQY/n+xzmw4hZhJ9tyYmcUS+4QqAlzhicE5LAfMQSF3iFTK9bQdTxXg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"
        integrity="sha512-SkmBfuA2hqjzEVpmnMt/LINrjop3GKWqsuLSSB3e7iBmYK7JuWw4ldmmxwD9mdm2IRTTi0OxSAfEGvgEi0i2Kw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Guilherme Konchinski Resume</title>
</head>

<body class="container-fluid">
    <div id="printHideArea">
        <div class="col-6" id="codingArea">
            <textarea id="jsonTextArea" class="col-6 position-absolute top-0 start-0"
                oninput="update(this.value, false); sync_scroll(this);" onscroll="sync_scroll(this);">
        </textarea>
    
            <pre id="highlighting" aria-hidden="true" class="col-6 position-absolute top-0 start-0">
            <code class="language-js" id="highlighting-content"></code>
        </pre>
        </div>
    
        <div class="btn-group align-center" id="buttonGroup">
            <button type="button" class="btn btn-outline-secondary" onclick="printResume()">Print</button>
            <button type="button" class="btn btn-outline-secondary" onclick="update(jsonTextArea.value, true);">Format</button>
        </div>
    </div>
    <main id="main">
    </main>
</body>

<script>
    let jsonData = `{
    "info": {
        "name": "Dale Earnhardt",
        "additionalInfo": [
            "Kannapolis, NC",
            "(123)-555-1234",
            "dale.e@gmail.com",
            "linkedin.com/in/daleE",
            "github.com/daleE"
        ]
    },
    "education": [
        {
            "trainingName": "Forklift University",
            "institutionName": null,
            "degreeName": "BS, Forklift Technology and Security",
            "graduationDate": "May 2025"
        }
    ],
    "skills": [
        {
            "categoryName": "Spoken Languages",
            "categoryValues": [
                "Forklift-ese"
            ]
        },
        {
            "categoryName": "Tools",
            "categoryValues": [
                "Forklifts"
            ]
        },
        {
            "categoryName": "Technologies",
            "categoryValues": [
                "Forklifts"
            ]
        },
        {
            "categoryName": "Certifications",
            "categoryValues": [
                "Forklift Certified"
            ]
        }
    ],
    "workExperience": [
        {
            "company": "Forklifts Drivers of America",
            "subCompany": "",
            "jobTitle": "Forklift Driver",
            "location": "Columbus, OH",
            "timeframe": {
                "start": "2022",
                "end": "2023"
            },
            "experience": [
                "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum cursus imperdiet enim, quis laoreet elit vestibulum ut.",
                "exp 2",
                "exp 3"
            ]
        }
    ],
    "projects": [
        {
            "name": "Test",
            "timeframe": {
                "start": "April 2015",
                "end": "Present"
            },
            "description": "A super interesting description here"
        }
    ],
    "references": []
}
    `;
    const jsonTextArea = document.getElementById("jsonTextArea");
    const codeArea = document.getElementById("highlighting-content");

    const visuallyHidden = "visually-hidden";
    function createDiv(textContent, attributes) {
        let div = document.createElement("div");

        attributes.forEach(attr => {
            div.classList.add(attr);
        })

        div.textContent = textContent;
        return div;
    }

    function printResume() {
        let printHideArea = document.getElementById("printHideArea");
        printHideArea.classList.add("visually-hidden");

        let main = document.getElementById("main");
        main.style.left = "0%";

        let html = document.getElementsByName("html").innerHTML

        try {
            navigator.clipboard.writeText(jsonTextArea.value);
        } catch {

        }

        window.print()

        printHideArea.classList.remove("visually-hidden");
        main.style.left = "55%";
    }
    function createHStack() {
        return createDiv("", ["hstack", "gap-2"]);
    }

    function createTimeFrameDiv(timeframe) {
        let timeframestring = timeframe.start + " - " + timeframe.end;
        return createDiv(timeframestring, ["text-muted", "ms-auto", "fw-light"]);
    }

    function update(text, shouldFormat) {
        try {
            let json = JSON.parse(text)
            console.log(json)
            let formatted = JSON.stringify(json, null, "\t")
            if (shouldFormat) {
                codeArea.innerHTML = formatted;
                jsonTextArea.value = formatted;
            } else {
                codeArea.innerHTML = text;
            }

            build(json);
        }
        catch {
            codeArea.innerHTML = text;
        } finally {
            // Syntax Highlight
            Prism.highlightElement(codeArea);
        }
    }

    function sync_scroll(element) {
        /* Scroll result to scroll coords of event - sync with textarea */
        let result_element = document.querySelector("#highlighting");
        // Get and set x and y
        result_element.scrollTop = element.scrollTop;
        result_element.scrollLeft = element.scrollLeft;
    }

    function build(json) {
        let main = document.getElementById("main");
        main.innerHTML = `
                <div class="header text-center fs-2 m-0" id="userName">
                </div>

                <div class="hstack p-0 m-0" id="userInfo">
                </div>

                <div class="pb-2 visually-hidden" id="education">
                    <p class="fs-4 m-0">Education</p>
                    <hr class="m-0" />
                </div>

                <div class="pb-2 visually-hidden" id="skills">
                    <p class="fs-4 m-0">Skills</p>
                    <hr class="m-0">
                </div>

                <div class="visually-hidden" id="experience">
                    <p class="fs-4 m-0">Experience</p>
                    <hr class="m-0">
                </div>

                <div class="visually-hidden" id="projects">
                    <p class="fs-4 m-0">Projects</p>
                    <hr class="m-0">
                </div>

                <div id="references">
                    <p class="text-muted text-center fw-light fst-italic">References available upon request</p>
                </div>
                `;

        let userNameDiv = document.getElementById("userName");
        userNameDiv.textContent = json.info.name
        document.title = json.info.name + " Resume"

        let userIdDiv = document.getElementById("userInfo");
        json.info.additionalInfo.forEach(e => {
            child = createDiv(e, ["fw-light", "text-muted", "mx-auto"]);
            userIdDiv.appendChild(child);
        });

        if (json.education && json.education.length > 0) {
            let educationDiv = document.getElementById("education");
            educationDiv.classList.remove(visuallyHidden);

            json.education.forEach(e => {
                let stack = createHStack();

                let title = createDiv(e.trainingName, ["fw-bold"]);
                stack.appendChild(title);

                let institution = createDiv(e.institutionName, ["text-muted", "fw-lighter"]);
                stack.appendChild(institution);

                let graduation = createDiv(e.graduationDate, ["text-muted", "ms-auto", "fw-light"]);
                stack.appendChild(graduation);

                let degree = createDiv(e.degreeName, ["fst-italic"]);

                educationDiv.appendChild(stack);
                educationDiv.appendChild(degree);
            });
        }

        if (json.skills && json.skills.length > 0) {
            let skillsDiv = document.getElementById("skills");
            skillsDiv.classList.remove(visuallyHidden);

            json.skills.forEach(e => {
                let wrappingDiv = createDiv("", []);

                let catName = document.createElement("strong");
                catName.textContent = e.categoryName + ": ";

                wrappingDiv.appendChild(catName);
                wrappingDiv.append(e.categoryValues.join(", "));

                skillsDiv.appendChild(wrappingDiv);
            });
        }

        if (json.workExperience && json.workExperience.length > 0) {
            let experienceDiv = document.getElementById("experience");
            experienceDiv.classList.remove(visuallyHidden);

            json.workExperience.forEach(e => {
                let wrappingDiv = document.createElement("div");

                let headerDiv = createHStack();

                let title = createDiv(e.company, ["fw-bold"]);
                headerDiv.appendChild(title);

                if (e.subCompany) {
                    title = createDiv(e.subCompany, ["text-muted", "fw-lighter"]);
                    headerDiv.appendChild(title);
                }

                title = document.createElement("div");
                title = createDiv(e.location, ["text-muted", "ms-auto", "fw-light"]);
                headerDiv.appendChild(title);

                wrappingDiv.appendChild(headerDiv);

                let titleDiv = createHStack();

                title = createDiv(e.jobTitle, ["fst-italic"]);
                titleDiv.appendChild(title);

                title = createDiv(e.timeframe.start + " - " + e.timeframe.end, ["text-muted", "ms-auto", "fw-light"]);
                titleDiv.appendChild(title);

                wrappingDiv.appendChild(titleDiv);

                let experienceList = document.createElement("ul");
                experienceList.classList.add("fs-7", "p-3", "pt-0", "m-0", "ms-1");

                e.experience.forEach(ex => {
                    let exp = document.createElement("li");
                    exp.textContent = ex;
                    experienceList.appendChild(exp);
                });

                wrappingDiv.appendChild(experienceList);
                experienceDiv.appendChild(wrappingDiv);
            });
        }

        if (json.projects && json.projects.length > 0) {
            let projectsDiv = document.getElementById("projects");
            projectsDiv.classList.remove(visuallyHidden);

            json.projects.forEach(e => {
                let wrappingDiv = createDiv("", []);
                let hstack = createHStack();
                let name = createDiv(e.name, ["fw-bold"]);
                let timeframe = createTimeFrameDiv(e.timeframe);
                let description = createDiv(e.description, []);

                hstack.appendChild(name);
                hstack.appendChild(timeframe);
                wrappingDiv.appendChild(hstack);
                wrappingDiv.appendChild(description);
                projectsDiv.appendChild(wrappingDiv);
            });
        }
    }

    update(jsonData, true)
</script>
<style>
    /* roughly the size of a sheet of paper */
    main {
        max-width: 915;
        max-height: 1056;
        position: absolute;
        left: 55%;
    }

    #jsonTextArea {
        color: transparent;
        background: transparent;
        caret-color: white;
        resize: none;
        /* Or choose your favorite color */
    }

    #jsonTextArea,
    #highlighting {
        /* Both elements need the same text and space styling so they are directly on top of each other */
        margin: 10px;
        padding: 10px;
        border: 0;
        overflow: auto;
        white-space: nowrap;
        height: 98%;
    }

    #jsonTextArea,
    #highlighting,
    #highlighting * {
        /* Also add text styles to highlighting tokens */
        font-size: 15pt;
        font-family: monospace;
        line-height: 20pt;
        tab-size: 2;
    }

    #jsonTextArea {
        z-index: 1;
    }

    #highlighting {
        z-index: 0;
    }

    #buttonGroup {
        position:absolute;
        left: 44%;
        top: 2%;
        z-index: 2;
    }
</style>

</html>
