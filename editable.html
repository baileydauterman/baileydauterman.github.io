<body class="container-fluid">
    <div id="printHideArea">
        <div class="col-6" id="codingArea">
            <textarea id="jsonTextArea" class="col-6 position-absolute top-0 start-0"
                oninput="update(this.value, false); sync_scroll(this);" onscroll="sync_scroll(this);">
        </textarea>
    
            <pre id="highlighting" aria-hidden="true" class="col-6 position-absolute top-0 start-0">
            <code class="language-js" id="highlighting-content"></code>
        </pre>
        </div>
    
        <div class="btn-group align-center" id="buttonGroup">
            <button type="button" class="btn btn-outline-secondary" onclick="printResume()">Print</button>
            <button type="button" class="btn btn-outline-secondary" onclick="update(jsonTextArea.value, true);">Format</button>
        </div>
    </div>

    <main id="main">
    </main>
</body>

<script>
    const jsonTextArea = document.getElementById("jsonTextArea");
    const codeArea = document.getElementById("highlighting-content");

    function createTimeFrameDiv(timeframe) {
        let timeframestring = timeframe.start + " - " + timeframe.end;
        return createDiv(timeframestring, ["text-muted", "ms-auto", "fw-light"]);
    }

    function update(text, shouldFormat) {
        try {
            let json = JSON.parse(text)
            let formatted = JSON.stringify(json, null, "\t")
            if (shouldFormat) {
                codeArea.innerHTML = formatted;
                jsonTextArea.value = formatted;
            } else {
                codeArea.innerHTML = text;
            }

            build(json);
        }
        catch {
            codeArea.innerHTML = text;
        } finally {
            // Syntax Highlight
            Prism.highlightElement(codeArea);
        }
    }

    function sync_scroll(element) {
        /* Scroll result to scroll coords of event - sync with textarea */
        let result_element = document.querySelector("#highlighting");
        // Get and set x and y
        result_element.scrollTop = element.scrollTop;
        result_element.scrollLeft = element.scrollLeft;
    }

    function build(json) {
        let main = document.getElementById("main");
        main.innerHTML = templatedHtml;

        createUserNameHeader(json.info.name)
        createContactInfo(json.info.contactInfo)

        if (json.education && json.education.length > 0) {
            createEducationSection(json.education);
        }

        if (json.skills && json.skills.length > 0) {
            createSkillsSection(json.skills);
        }

        if (json.workExperience && json.workExperience.length > 0) {
            createWorkExperienceSection(json.workExperience);
        }

        if (json.projects && json.projects.length > 0) {
            createProjectsSection(json.projects);
        }
    }

    update(testJsonData, true)
</script>

</html>
